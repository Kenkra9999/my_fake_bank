name: my_fake_bank
description: "A new Flutter project for Banking and Crypto Trading."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  candlesticks: ^2.1.0
  syncfusion_flutter_charts: ^25.1.37
  intl: ^0.19.0
  mobile_scanner: ^5.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  syncfusion_flutter_charts: ^33.2.4
  syncfusion_flutter_core: ^33.2.4